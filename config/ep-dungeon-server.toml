#Ajustes de EP Dungeon. El addon también excluye Charybdis del requisito global de reinicio.
[farming]
	#Multiplica el EP nominal de los cinco pisos. El ajuste posterior x0.408 deja 2040, 6120, 15300, 30600 y 61200 EP para enemigos normales con multiplicador 1.
	# Default: 1.0
	# Range: 0.01 ~ 100.0
	epMultiplier = 1.0
	# Default: 1.0
	# Range: 0.05 ~ 100.0
	healthMultiplier = 1.0
	# Default: 1.0
	# Range: 0.05 ~ 100.0
	damageMultiplier = 1.0
	#Probabilidad de elite: EP x4, vida x2.5, dano x1.5.
	# Default: 0.12
	# Range: 0.0 ~ 1.0
	eliteChance = 0.12
	#Un campeon cada N apariciones por sala: EP x10, vida x5, dano x2. 0 desactiva.
	# Default: 60
	# Range: 0 ~ 10000
	championEverySpawns = 60
	#IDs de mobs de Tensura; los de ataque sonico se excluyen incluso en configs anteriores.
	entityPool = ["tensura:orc", "tensura:lizardman", "tensura:giant_bear", "tensura:black_spider", "tensura:knight_spider", "tensura:armorsaurus"]

[population]
	#Poblacion objetivo por piso ocupado. Reemplaza los limites ignorados de farming en 1.0.23.
	# Default: 20
	# Range: 1 ~ 160
	targetPerFloor = 20
	#Maximo total de enemigos propios cargados: 100 permite 20 en cada uno de los cinco pisos.
	# Default: 100
	# Range: 1 ~ 800
	maxAliveTotal = 100

[performance]
	#Bloques colocados por tick al construir una sala por primera vez.
	# Default: 1000
	# Range: 100 ~ 5000
	blocksPerTick = 1000
	#Pausa solo los nuevos refuerzos si el servidor supera este promedio de milisegundos por tick. Reanuda por debajo del 90%. 0 desactiva la pausa.
	# Default: 0.0
	# Range: 0.0 ~ 1000.0
	pauseRefillAboveMspt = 0.0

[combat]
	#Maximo de durabilidad que pierde cada pieza de armadura por golpe dentro de la dungeon. El dano al jugador no cambia. 0 desactiva el limite.
	# Default: 2
	# Range: 0 ~ 1000
	maxArmorWearPerHit = 2
